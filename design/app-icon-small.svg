<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="18" y1="4" x2="110" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6674ff"/>
      <stop offset="0.55" stop-color="#3d49d8"/>
      <stop offset="1" stop-color="#1c2573"/>
    </linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="56" y="40" width="56" height="88" rx="14" fill="#000"/>
    </mask>
  </defs>
  <!-- Simplified for 16px and 32px: heavier lines, no fine detail, edges on an 8-unit grid -->
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <g mask="url(#gap)">
    <rect x="20" y="28" width="72" height="48" rx="6" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="8"/>
    <rect x="40" y="88" width="32" height="8" fill="#ffffff"/>
  </g>
  <rect x="64" y="48" width="40" height="72" rx="8" fill="#ffffff"/>
  <rect x="72" y="56" width="24" height="56" rx="3" fill="#1d2778"/>
</svg>
