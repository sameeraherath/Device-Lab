<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Option C: floating glass on a deep tile. The trio as frosted glass panels with bright edges,
       overlapping in depth, lit by an indigo/cyan backlight. -->
  <defs>
    <linearGradient id="c-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#05061a"/>
    </linearGradient>
    <radialGradient id="c-light" cx="0.62" cy="0.58" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="c-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="c-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="c-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="c-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#c-tile)"/>
  <rect width="128" height="128" rx="28" fill="url(#c-light)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#a5b4fc" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Laptop at the back (slightly soft for depth) -->
  <g opacity="0.85">
    <rect x="12" y="26" width="64" height="42" rx="5" fill="#000" opacity="0.35" filter="url(#c-soft)" transform="translate(3 5)"/>
    <rect x="12" y="26" width="64" height="42" rx="5" fill="url(#c-glass)" stroke="url(#c-edge)" stroke-width="1.5"/>
    <rect x="16" y="30" width="56" height="34" rx="2.5" fill="url(#c-screen)" opacity="0.55"/>
    <path d="M6 72 H82 L86 78 H2 Z" fill="url(#c-glass)" stroke="url(#c-edge)" stroke-width="1.2"/>
  </g>

  <!-- Tablet -->
  <rect x="54" y="44" width="36" height="50" rx="6" fill="#000" opacity="0.4" filter="url(#c-soft)" transform="translate(3 6)"/>
  <rect x="54" y="44" width="36" height="50" rx="6" fill="#1b1d4a"/>
  <rect x="54" y="44" width="36" height="50" rx="6" fill="url(#c-glass)" stroke="url(#c-edge)" stroke-width="1.6"/>
  <rect x="58" y="48" width="28" height="42" rx="3" fill="url(#c-screen)" opacity="0.9"/>

  <!-- Phone in front -->
  <rect x="86" y="58" width="26" height="46" rx="7" fill="#000" opacity="0.45" filter="url(#c-soft)" transform="translate(3 6)"/>
  <rect x="86" y="58" width="26" height="46" rx="7" fill="#1b1d4a"/>
  <rect x="86" y="58" width="26" height="46" rx="7" fill="url(#c-glass)" stroke="url(#c-edge)" stroke-width="1.8"/>
  <rect x="89.5" y="61.5" width="19" height="39" rx="4.5" fill="url(#c-screen)"/>
  <path d="M89.5 66 Q89.5 61.5 94 61.5 H104 L89.5 84 Z" fill="#fff" opacity="0.3"/>
  <rect x="95.5" y="63.5" width="7" height="2" rx="1" fill="#0b0a1f" opacity="0.8"/>
</svg>
