<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Option A, small (16/32 px): same trio, bold shapes, one highlight, 1px depth edge. -->
  <defs>
    <linearGradient id="as-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="as-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0b0a1f"/>
    </linearGradient>
    <linearGradient id="as-screen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#as-tile)"/>
  <!-- laptop -->
  <rect x="4.5" y="7.5" width="17" height="12" rx="1.5" fill="#3b4052"/>
  <rect x="4" y="7" width="17" height="12" rx="1.5" fill="#e9ebf1"/>
  <rect x="5" y="8" width="15" height="10" rx="0.8" fill="url(#as-screen)"/>
  <rect x="2" y="19" width="22" height="2.5" rx="1.25" fill="#d6d9e2"/>
  <!-- tablet -->
  <rect x="15.5" y="11.5" width="9.5" height="13.5" rx="1.6" fill="#3b4052"/>
  <rect x="15" y="11" width="9.5" height="13.5" rx="1.6" fill="#e9ebf1"/>
  <rect x="16" y="12" width="7.5" height="11.5" rx="0.8" fill="url(#as-screen2)"/>
  <!-- phone -->
  <rect x="23" y="15.5" width="6.5" height="11.5" rx="1.6" fill="#3b4052"/>
  <rect x="22.5" y="15" width="6.5" height="11.5" rx="1.6" fill="#e9ebf1"/>
  <rect x="23.4" y="16" width="4.7" height="9.5" rx="0.9" fill="url(#as-screen)"/>
</svg>
