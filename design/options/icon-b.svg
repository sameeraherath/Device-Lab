<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Option B: isometric trio on a light tile. Each device stands on a 30° isometric plane with a
       lit front face, a darker side face for thickness, and a glowing brand-coloured screen. -->
  <defs>
    <linearGradient id="b-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e7f2"/>
    </linearGradient>
    <linearGradient id="b-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4fe0"/>
      <stop offset="1" stop-color="#2531a8"/>
    </linearGradient>
    <linearGradient id="b-sidefill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2580"/>
      <stop offset="1" stop-color="#121852"/>
    </linearGradient>
    <linearGradient id="b-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.6" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="b-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7cf5"/>
      <stop offset="1" stop-color="#4a59e6"/>
    </linearGradient>
    <filter id="b-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#b-tile)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#c7cde0" stroke-width="1.5"/>

  <g transform="translate(17 8) scale(0.84)">
  <!-- Floor shadow (isometric diamond) -->
  <path d="M14 92 L66 118 L118 92 L66 66 Z" fill="#283593" opacity="0.18" filter="url(#b-blur)"/>

  <!-- Laptop (back): lid face, lid side, deck -->
  <g transform="matrix(0.866 0.5 0 1 14 20)">
    <rect x="0" y="0" width="56" height="38" rx="3.5" fill="url(#b-face)"/>
    <rect x="3" y="3" width="50" height="31" rx="1.8" fill="url(#b-screen)"/>
    <rect x="3" y="3" width="50" height="12" rx="1.8" fill="#fff" opacity="0.25"/>
  </g>
  <path d="M14 20 L14 58 L11 59.7 L11 21.7 Z" fill="url(#b-sidefill)"/>
  <!-- deck lying on the floor plane -->
  <path d="M14 58 L62.5 86 L40 99 L-8.5 71 Z" transform="translate(9 0)" fill="url(#b-top)"/>
  <path d="M0.5 71 L49 99 L49 102 L0.5 74 Z" fill="url(#b-sidefill)"/>
  <path d="M49 99 L71.5 86 L71.5 89 L49 102 Z" fill="#1c2580"/>

  <!-- Tablet (middle) -->
  <g transform="matrix(0.866 0.5 0 1 62 44)">
    <rect x="0" y="0" width="30" height="40" rx="3.5" fill="url(#b-face)"/>
    <rect x="2.6" y="2.6" width="24.8" height="34.8" rx="1.8" fill="url(#b-screen)"/>
    <rect x="2.6" y="2.6" width="24.8" height="12" rx="1.8" fill="#fff" opacity="0.25"/>
  </g>
  <path d="M62 44 L62 84 L59 85.7 L59 45.7 Z" fill="url(#b-sidefill)"/>

  <!-- Phone (front) -->
  <g transform="matrix(0.866 0.5 0 1 92 62)">
    <rect x="0" y="0" width="18" height="34" rx="3.5" fill="url(#b-face)"/>
    <rect x="2" y="2.4" width="14" height="29.2" rx="2" fill="url(#b-screen)"/>
    <rect x="2" y="2.4" width="14" height="10" rx="2" fill="#fff" opacity="0.25"/>
  </g>
  <path d="M92 62 L92 96 L89 97.7 L89 63.7 Z" fill="url(#b-sidefill)"/>
  </g>
</svg>
