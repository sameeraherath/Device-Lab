<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Option C, small (16/32 px): glass panels reduced to bright edges and glowing screens. -->
  <defs>
    <linearGradient id="cs-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#05061a"/>
    </linearGradient>
    <radialGradient id="cs-light" cx="0.62" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cs-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#cs-tile)"/>
  <rect width="32" height="32" rx="7.5" fill="url(#cs-light)"/>
  <!-- laptop -->
  <rect x="3.5" y="7" width="16" height="11" rx="1.5" fill="#2a2d5c" stroke="#c7d2fe" stroke-opacity="0.8"/>
  <rect x="5" y="8.5" width="13" height="8" rx="0.6" fill="url(#cs-screen)" opacity="0.6"/>
  <rect x="1.5" y="19" width="20" height="1.6" rx="0.8" fill="#c7d2fe" opacity="0.7"/>
  <!-- tablet -->
  <rect x="14" y="11" width="9" height="13" rx="1.6" fill="#1b1d4a" stroke="#e0e7ff"/>
  <rect x="15.3" y="12.3" width="6.4" height="10.4" rx="0.7" fill="url(#cs-screen)"/>
  <!-- phone -->
  <rect x="22" y="15" width="7" height="12" rx="1.8" fill="#1b1d4a" stroke="#fff"/>
  <rect x="23.2" y="16.2" width="4.6" height="9.6" rx="1" fill="url(#cs-screen)"/>
</svg>
