<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Option A (Meta blue): hero trio in a front 3/4 view on an indigo tile. Laptop at the back, tablet,
       phone in front; each with metal edges, side thickness, dark glass and a reflection. -->
  <defs>
    <linearGradient id="a2-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a8cff"/>
      <stop offset="1" stop-color="#0057d9"/>
    </linearGradient>
    <radialGradient id="a2-glow" cx="0.5" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#a5d8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a5d8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a2-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f8"/>
      <stop offset="0.55" stop-color="#c9cdd8"/>
      <stop offset="1" stop-color="#9097a8"/>
    </linearGradient>
    <linearGradient id="a2-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7184"/>
      <stop offset="1" stop-color="#3b4052"/>
    </linearGradient>
    <linearGradient id="a2-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f5"/>
      <stop offset="1" stop-color="#a3a9b8"/>
    </linearGradient>
    <linearGradient id="a2-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8bff"/>
      <stop offset="0.5" stop-color="#0a1d4d"/>
      <stop offset="1" stop-color="#040a1c"/>
    </linearGradient>
    <linearGradient id="a2-screen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#0064e0"/>
      <stop offset="1" stop-color="#061230"/>
    </linearGradient>
    <linearGradient id="a2-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.46" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="a2-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#a2-tile)"/>
  <rect width="128" height="128" rx="28" fill="url(#a2-glow)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>

  <g transform="translate(4 1)">
  <!-- Ground shadow -->
  <ellipse cx="64" cy="100" rx="52" ry="6" fill="#03163d" opacity="0.5" filter="url(#a2-shadow)"/>

  <!-- Laptop: lid with side thickness, screen, deck -->
  <rect x="17" y="27" width="66" height="46" rx="5" fill="url(#a2-side)"/>
  <rect x="15" y="25" width="66" height="46" rx="5" fill="url(#a2-metal)"/>
  <rect x="18.5" y="28.5" width="59" height="39" rx="2.5" fill="url(#a2-screen)"/>
  <rect x="18.5" y="28.5" width="59" height="39" rx="2.5" fill="url(#a2-shine)"/>
  <path d="M10 73 H86 L94 83 Q95 86 92 86 H4 Q1 86 2 83 Z" fill="url(#a2-deck)"/>
  <path d="M4 86 H92 Q94 86 93.5 87.5 Q93 89 91 89 H5 Q3 89 2.5 87.5 Q2 86 4 86 Z" fill="#6b7184"/>
  <rect x="38" y="73" width="20" height="2.5" rx="1.25" fill="#8d93a4"/>

  <!-- Tablet -->
  <rect x="62.5" y="45.5" width="36" height="50" rx="5.5" fill="url(#a2-side)"/>
  <rect x="60" y="43" width="36" height="50" rx="5.5" fill="url(#a2-metal)"/>
  <rect x="63" y="46" width="30" height="44" rx="3" fill="url(#a2-screen2)"/>
  <rect x="63" y="46" width="30" height="44" rx="3" fill="url(#a2-shine)"/>

  <!-- Phone -->
  <rect x="91.5" y="61.5" width="25" height="43" rx="6" fill="url(#a2-side)"/>
  <rect x="89" y="59" width="25" height="43" rx="6" fill="url(#a2-metal)"/>
  <rect x="91.5" y="61.5" width="20" height="38" rx="4" fill="url(#a2-screen)"/>
  <rect x="91.5" y="61.5" width="20" height="38" rx="4" fill="url(#a2-shine)"/>
  <rect x="98" y="63.5" width="7" height="2.2" rx="1.1" fill="#05050f"/>
  </g>
</svg>
