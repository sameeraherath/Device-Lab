<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.333 -5.333 42.667 42.667" width="128" height="128">
  <!-- Device Lab icon, large (48 and 128 px): a blue laptop with a phone in front, white screens,
       transparent background, padded so the artwork is about 96 of 128 px. The phone is cut out of the laptop with a gap so both read at 16 px. -->
  <defs>
    <mask id="t1-cut">
      <rect x="-6" y="-6" width="44" height="44" fill="#fff"/>
      <rect x="18" y="10" width="13" height="21" rx="3.5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#t1-cut)">
    <rect x="3" y="5" width="22" height="15" rx="2.5" fill="#1877f2"/>
    <rect x="5.5" y="7.5" width="17" height="10" rx="1" fill="#ffffff"/>
    <rect x="0.5" y="21" width="27" height="3.5" rx="1.75" fill="#1877f2"/>
  </g>
  <rect x="20" y="12" width="9" height="17" rx="2.2" fill="#1877f2"/>
  <rect x="21.7" y="14" width="5.6" height="12" rx="1" fill="#ffffff"/>
</svg>
