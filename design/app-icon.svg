<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Deep indigo to navy tile, with a soft light from the top left -->
    <linearGradient id="tile" x1="18" y1="4" x2="110" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6674ff"/>
      <stop offset="0.55" stop-color="#3d49d8"/>
      <stop offset="1" stop-color="#1c2573"/>
    </linearGradient>
    <radialGradient id="glow" cx="30" cy="18" r="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e0ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3aa8"/>
      <stop offset="1" stop-color="#16206a"/>
    </linearGradient>
    <!-- Cuts a clear gap around the phone so the two devices read as separate shapes -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="58" y="42" width="48" height="76" rx="11" fill="#000"/>
    </mask>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1240" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <rect width="128" height="128" rx="30" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Wide screen (laptop / desktop), behind -->
  <g mask="url(#gap)">
    <rect x="17" y="26" width="76" height="52" rx="9" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="7"/>
    <rect x="38" y="86" width="34" height="7" rx="3.5" fill="#ffffff"/>
  </g>

  <!-- Phone, in front -->
  <g filter="url(#lift)">
    <rect x="62" y="46" width="40" height="68" rx="9" fill="url(#body)"/>
    <rect x="66.5" y="50.5" width="31" height="59" rx="5.5" fill="url(#screen)"/>
    <rect x="76" y="54" width="12" height="3.6" rx="1.8" fill="#ffffff" fill-opacity="0.85"/>
  </g>
</svg>
